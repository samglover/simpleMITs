# Publishes the site to GitHub Pages.
#
# Writes assets/js/config.js from the SUPABASE_URL and SUPABASE_KEY repository
# variables, so the Supabase settings aren't in the repo. Forks don't inherit
# repository variables, so their copies deploy with sync turned off.
#
# Also fills in the Cloudflare Web Analytics token in index.html from the
# CLOUDFLARE_ANALYTICS_TOKEN repository variable. Without it, the beacon is removed.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write config.js from repository variables
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
        run: |
          node -e '
            const config = {
              supabaseUrl: process.env.SUPABASE_URL || "",
              supabaseKey: process.env.SUPABASE_KEY || ""
            };
            const body = "/* Generated by .github/workflows/deploy.yml */\nconst SIMPLEMITS_CONFIG = " + JSON.stringify(config, null, 2) + ";\n";
            require("fs").writeFileSync("assets/js/config.js", body);
          '
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice::SUPABASE_URL or SUPABASE_KEY is not set, so sync is turned off for this deploy."
          fi

      - name: Set the Cloudflare Web Analytics token from a repository variable
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const token = process.env.CLOUDFLARE_ANALYTICS_TOKEN || "";
            const html = fs.readFileSync("index.html", "utf8");
            const beacon = /^[ \t]*<script[^>]*static\.cloudflareinsights\.com\/beacon\.min\.js[^>]*><\/script>\r?\n/m;
            if (!beacon.test(html)) {
              console.error("::error::Could not find the Cloudflare beacon script in index.html.");
              process.exit(1);
            }
            const updated = token
              ? html.replace(beacon, (tag) => tag.replace("CLOUDFLARE_ANALYTICS_TOKEN", () => token.replace(/[^A-Za-z0-9_-]/g, "")))
              : html.replace(beacon, "");
            fs.writeFileSync("index.html", updated);
          '
          if [ -z "$CLOUDFLARE_ANALYTICS_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_ANALYTICS_TOKEN is not set, so the Cloudflare beacon was removed for this deploy."
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
